name: Check cook applications

# Every 15 minutes: look new cook applications up on the FSA register, score
# them green/amber/red and approve the green ones (see scripts/check-applications.mjs).
# Also sends cooks reminders before their insurance runs out.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: application-checks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Check applications
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/check-applications.mjs
      - name: Insurance reminders
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -qAt -c "select food.insurance_reminders()"
